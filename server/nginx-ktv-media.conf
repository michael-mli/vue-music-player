# Add inside the existing HTTPS site. Never proxy raw LiveKit /rtc or /twirp.
# The query includes a short-lived token: disable request and error URL logging.
location = /api/ktv/media/rtc {
    access_log off;
    error_log /dev/null;
    proxy_pass http://127.0.0.1:3103;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 70s;
    proxy_send_timeout 70s;
}
location = /api/ktv/media/rtc/v1 {
    access_log off;
    error_log /dev/null;
    proxy_pass http://127.0.0.1:3103;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 70s;
    proxy_send_timeout 70s;
}
location = /api/ktv/media/rtc/validate {
    access_log off;
    error_log /dev/null;
    proxy_pass http://127.0.0.1:3103;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    add_header Cache-Control "no-store" always;
}
